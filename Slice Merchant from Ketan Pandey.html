<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slice business | India's First Digital Business Bank</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for browser-side JSX -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons (Vanilla UMD is more stable in this environment) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Custom scrollbar for desktop */
        @media (min-width: 768px) {
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                background: #f1f1f1;
            }
            ::-webkit-scrollbar-thumb {
                background: #d1d1d1;
                border-radius: 10px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #a1a1a1;
            }
        }
    </style>
</head>
<body class="bg-white text-neutral-900 selection:bg-purple-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Icon component to bridge Vanilla Lucide with React stably
        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    window.lucide.createIcons({
                        icons: { [name]: window.lucide.icons[name] },
                        attrs: {
                            'stroke-width': 2,
                            'width': size,
                            'height': size,
                            'class': className
                        }
                    });
                }
            }, [name, size, className]);

            return (
                <span 
                    ref={iconRef} 
                    data-lucide={name} 
                    className={`inline-flex items-center justify-center ${className}`}
                    style={{ width: size, height: size }}
                ></span>
            );
        };

        const apiKey = ""; // Provided at runtime

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [loading, setLoading] = useState(true);
            const [images, setImages] = useState({
                hero: 'https://images.unsplash.com/photo-1616077168079-7e09a677fb2c?auto=format&fit=crop&q=80&w=1200',
                soundbox: '',
                app: '',
                enterprise: ''
            });

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                generateImages();
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const generateImages = async () => {
                if (!apiKey) {
                    setLoading(false);
                    return;
                }
                
                setLoading(true);
                try {
                    const prompts = {
                        soundbox: "A sleek purple and black digital payment soundbox with a UPI QR code stand on a clean cafe counter, high-end commercial product photography.",
                        app: "Close-up of a premium mobile business banking app dashboard with purple charts and white interface, held by an entrepreneur.",
                        enterprise: "Modern bright manufacturing warehouse with professional machinery and organized stock, representing a successful MSME business."
                    };

                    const imagePromises = Object.entries(prompts).map(async ([key, prompt]) => {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                instances: { prompt }, 
                                parameters: { sampleCount: 1 } 
                            })
                        });
                        const result = await response.json();
                        if (result.predictions && result.predictions[0]) {
                            return [key, `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`];
                        }
                        return [key, null];
                    });

                    const results = await Promise.all(imagePromises);
                    const validImages = Object.fromEntries(results.filter(([_, val]) => val !== null));
                    setImages(prev => ({ ...prev, ...validImages }));
                } catch (err) {
                    console.error("AI Image Generation failed:", err);
                } finally {
                    setLoading(false);
                }
            };

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    const offset = 80;
                    const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
                    window.scrollTo({ top: elementPosition - offset, behavior: 'smooth' });
                }
            };

            const StatItem = ({ val, label }) => (
                <div className="text-center group">
                    <div className="text-3xl font-black text-black mb-1 group-hover:text-purple-600 transition-colors tracking-tighter">{val}</div>
                    <div className="text-[10px] font-black uppercase tracking-widest text-neutral-400">{label}</div>
                </div>
            );

            const NavCard = ({ id, iconName, title, desc }) => (
                <button 
                    onClick={() => scrollToSection(id)}
                    className="group text-left p-8 bg-white border border-neutral-200 rounded-[2.5rem] hover:bg-black hover:text-white hover:border-black transition-all duration-500 shadow-sm hover:shadow-2xl hover:-translate-y-2"
                >
                    <div className="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                        <LucideIcon name={iconName} size={24} />
                    </div>
                    <div className="flex justify-between items-start mb-2">
                        <h3 className="text-2xl font-black tracking-tight">{title}</h3>
                        <LucideIcon name="arrow-up-right" className="text-neutral-300 group-hover:text-purple-400 group-hover:translate-x-1 group-hover:-translate-y-1 transition-all" size={24} />
                    </div>
                    <p className="text-neutral-500 group-hover:text-neutral-400 text-sm font-medium leading-relaxed">
                        {desc}
                    </p>
                </button>
            );

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className={`fixed top-0 w-full z-[100] transition-all duration-300 ${isScrolled ? 'bg-white/90 backdrop-blur-xl border-b border-neutral-100 py-3' : 'bg-transparent py-6'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
                                <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center">
                                    <div className="w-4 h-4 border-2 border-white rotate-45"></div>
                                </div>
                                <span className="text-xl font-black tracking-tighter">slice business</span>
                            </div>
                            
                            <div className="hidden lg:flex items-center gap-8 text-[11px] font-black uppercase tracking-[0.15em] text-neutral-400">
                                <button onClick={() => scrollToSection('accounts')} className="hover:text-black transition-colors">Accounts</button>
                                <button onClick={() => scrollToSection('digital-loans')} className="hover:text-black transition-colors">Digital Loans</button>
                                <button onClick={() => scrollToSection('enterprise')} className="hover:text-black transition-colors">Enterprise</button>
                                <button className="hover:text-black transition-colors">Rewards</button>
                            </div>

                            <button className="bg-black text-white px-6 py-2.5 rounded-full font-bold text-sm hover:scale-105 transition-all active:scale-95 shadow-lg shadow-black/10">
                                Download App
                            </button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="relative pt-40 pb-20 px-6 bg-neutral-50 overflow-hidden">
                        <div className="max-w-7xl mx-auto">
                            <div className="grid lg:grid-cols-2 gap-16 items-center mb-24">
                                <div className="z-10">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-white border border-neutral-200 rounded-full text-[10px] font-black uppercase tracking-widest text-neutral-500 mb-8">
                                        <LucideIcon name="zap" size={12} className="text-purple-500" /> India's First Truly Digital Business Bank
                                    </div>
                                    <h1 className="text-6xl md:text-[90px] font-black leading-[0.85] tracking-tighter mb-8">
                                        Run your <br />
                                        business <br />
                                        <span className="text-[#8B5CF6] italic">smarter.</span>
                                    </h1>
                                    <p className="text-xl text-neutral-500 font-medium max-w-md leading-relaxed">
                                        Open a zero-balance current account, accept payments with Soundbox, and get instant business loans.
                                    </p>
                                </div>
                                
                                <div className="relative group hidden lg:block">
                                    <div className="absolute -top-10 -right-10 w-96 h-96 bg-purple-200/50 rounded-full blur-[100px] -z-10"></div>
                                    <div className="relative rounded-[3rem] overflow-hidden shadow-2xl rotate-2 group-hover:rotate-0 transition-transform duration-700 max-h-[480px]">
                                        <img src={images.hero} className="w-full h-full object-cover" alt="Founder" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex flex-col justify-end p-12">
                                            <div className="text-white">
                                                <div className="text-4xl font-black italic mb-2">slice</div>
                                                <p className="font-bold text-neutral-200">Trusted by 18,235+ Founders</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-3 gap-6">
                                <NavCard id="accounts" iconName="wallet" title="Current Account" desc="Zero balance, built-in QR, and settlements that keep up with you." />
                                <NavCard id="digital-loans" iconName="coins" title="Business Loan" desc="Get up to ₹5L in 5 minutes with interest rates starting at 20%." />
                                <NavCard id="enterprise" iconName="building-2" title="Enterprise Loan" desc="Growth capital up to ₹30L for MSMEs starting at 13% interest." />
                            </div>
                        </div>
                    </section>

                    {/* Quick Stats */}
                    <section className="py-16 border-y border-neutral-100 bg-white">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-12">
                            <StatItem val="5 Mins" label="Account Opening" />
                            <StatItem val="₹30L" label="Max Loan Limit" />
                            <StatItem val="0" label="Hidden Charges" />
                            <StatItem val="24/7" label="Digital Support" />
                        </div>
                    </section>

                    {/* Current Account Section */}
                    <section id="accounts" className="py-32 px-6">
                        <div className="max-w-7xl mx-auto">
                            <div className="grid lg:grid-cols-2 gap-20 items-center">
                                <div className="relative">
                                    {loading && !images.soundbox ? (
                                        <div className="w-full h-[550px] bg-neutral-100 rounded-[3rem] animate-pulse flex items-center justify-center">
                                            <div className="text-neutral-300 font-bold uppercase tracking-widest">Generating Visuals...</div>
                                        </div>
                                    ) : (
                                        <div className="relative">
                                            <img src={images.soundbox || 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&q=80&w=800'} className="rounded-[3rem] shadow-2xl w-full h-[550px] object-cover" alt="Soundbox" />
                                            <div className="absolute -bottom-6 -right-6 bg-white p-8 rounded-[2.5rem] shadow-2xl border border-neutral-100 max-w-[280px] animate-float">
                                                <div className="flex items-center gap-3 mb-4">
                                                    <div className="p-2.5 bg-emerald-100 text-emerald-600 rounded-xl">
                                                        <LucideIcon name="volume-2" size={24} />
                                                    </div>
                                                    <span className="font-black text-sm italic uppercase tracking-tighter">Soundbox</span>
                                                </div>
                                                <p className="text-sm text-neutral-500 font-semibold leading-relaxed">
                                                    "Received ₹500 on slice business" — Clear audio confirmations for every payment.
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="space-y-10">
                                    <h2 className="text-6xl font-black tracking-tighter leading-[1.1]">
                                        Banking that <br /> <span className="text-[#8B5CF6]">talks business</span>.
                                    </h2>
                                    <p className="text-xl text-neutral-500 font-medium leading-relaxed">
                                        Accept payments, get settled in real-time, and stay on top of your cashflow without ever visiting a branch.
                                    </p>
                                    <div className="grid sm:grid-cols-2 gap-8">
                                        {[
                                            { title: 'Zero Balance', desc: 'No minimum balance or hidden penalties.', icon: 'shield-check' },
                                            { title: 'Built-in QR', desc: 'Dedicated UPI QR for instant settlements.', icon: 'qr-code' },
                                            { title: 'Instant Settled', desc: 'Get your funds on the same day.', icon: 'zap' },
                                            { title: 'No Spam', desc: 'We only call when it actually matters.', icon: 'smartphone' }
                                        ].map((feat, i) => (
                                            <div key={i} className="space-y-3">
                                                <div className="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center">
                                                    <LucideIcon name={feat.icon} size={20} className="text-purple-600" />
                                                </div>
                                                <div className="font-black text-sm uppercase tracking-wider">{feat.title}</div>
                                                <p className="text-sm text-neutral-400 font-medium">{feat.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Digital Loans Section */}
                    <section id="digital-loans" className="py-32 px-6 bg-black text-white rounded-[4rem] mx-4 md:mx-10 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-[600px] h-[600px] bg-purple-600/20 blur-[150px] rounded-full"></div>
                        <div className="max-w-7xl mx-auto relative z-10">
                            <div className="grid lg:grid-cols-2 gap-20 items-center">
                                <div className="space-y-12">
                                    <div>
                                        <div className="text-[#8B5CF6] text-xs font-black uppercase tracking-[0.4em] mb-6">Sole Proprietor Loans</div>
                                        <h2 className="text-6xl font-black tracking-tighter mb-8 leading-tight">
                                            Grow with <br /> ₹5L in minutes.
                                        </h2>
                                        <p className="text-neutral-400 text-xl font-medium leading-relaxed">
                                            100% digital application. No physical paperwork, no hidden costs. Just the capital you need to scale.
                                        </p>
                                    </div>

                                    <div className="space-y-5">
                                        {[
                                            'Interest rates starting at 20%',
                                            'Zero foreclosure charges',
                                            'Flexible daily or monthly installments',
                                            'No branch visits required'
                                        ].map((point, i) => (
                                            <div key={i} className="flex items-center gap-4">
                                                <div className="w-6 h-6 rounded-full bg-purple-500/20 flex items-center justify-center">
                                                    <LucideIcon name="check-circle-2" size={16} className="text-[#8B5CF6]" />
                                                </div>
                                                <span className="font-bold text-neutral-200">{point}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <button className="bg-white text-black px-12 py-5 rounded-[1.5rem] font-black text-lg hover:scale-105 transition-all active:scale-95 shadow-2xl">
                                        Apply in 2 Minutes
                                    </button>
                                </div>

                                <div className="relative">
                                    {loading && !images.app ? (
                                        <div className="w-full h-[600px] bg-neutral-900 rounded-[3rem] animate-pulse flex items-center justify-center">
                                            <div className="text-neutral-700 font-bold uppercase tracking-widest">Generating UI...</div>
                                        </div>
                                    ) : (
                                        <img src={images.app || 'https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&q=80&w=800'} className="rounded-[4rem] shadow-2xl border-[12px] border-white/5 w-full h-auto" alt="Loan App" />
                                    )}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Enterprise Section */}
                    <section id="enterprise" className="py-40 px-6">
                        <div className="max-w-7xl mx-auto">
                            <div className="text-center max-w-3xl mx-auto mb-24">
                                <LucideIcon name="building-2" size={56} className="text-purple-600 mx-auto mb-8" />
                                <h2 className="text-6xl font-black tracking-tighter mb-8 italic leading-tight">Expansion ready capital.</h2>
                                <p className="text-xl text-neutral-500 font-medium leading-relaxed">
                                    Designed for MSMEs looking to take the next big step. Secured loans against stock, machinery, or land.
                                </p>
                            </div>

                            <div className="grid md:grid-cols-3 gap-8 mb-16">
                                <div className="p-12 bg-neutral-50 rounded-[3rem] border border-neutral-100 hover:border-purple-200 transition-all group">
                                    <div className="text-5xl font-black mb-2 tracking-tighter group-hover:text-purple-600 transition-colors">₹30L</div>
                                    <div className="text-xs font-black uppercase text-purple-600 tracking-widest mb-6">Maximum Limit</div>
                                    <p className="text-neutral-500 font-medium leading-relaxed">Scale production and inventory with ease.</p>
                                </div>
                                <div className="p-12 bg-black text-white rounded-[3rem] shadow-2xl relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-8 text-purple-500 opacity-20 group-hover:opacity-40 transition-opacity">
                                        <LucideIcon name="trending-up" size={60} />
                                    </div>
                                    <div className="text-5xl font-black mb-2 tracking-tighter group-hover:text-purple-400 transition-colors italic">13%</div>
                                    <div className="text-xs font-black uppercase text-purple-400 tracking-widest mb-6">Starting Rate</div>
                                    <p className="text-neutral-400 font-medium leading-relaxed">Most competitive secured rates in India.</p>
                                </div>
                                <div className="p-12 bg-neutral-50 rounded-[3rem] border border-neutral-100 hover:border-purple-200 transition-all group">
                                    <div className="text-5xl font-black mb-2 tracking-tighter group-hover:text-purple-600 transition-colors">3 Days</div>
                                    <div className="text-xs font-black uppercase text-purple-600 tracking-widest mb-6">Disbursement</div>
                                    <p className="text-neutral-500 font-medium leading-relaxed">Quick processing for fast-moving businesses.</p>
                                </div>
                            </div>

                            <div className="relative rounded-[4rem] overflow-hidden group">
                                {loading && !images.enterprise ? (
                                    <div className="w-full h-[500px] bg-neutral-100 animate-pulse flex items-center justify-center font-bold text-neutral-300">Visualizing Enterprise Scale...</div>
                                ) : (
                                    <img src={images.enterprise || 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=1200'} className="w-full h-[500px] object-cover transition-transform duration-1000 group-hover:scale-110" alt="Factory" />
                                )}
                                <div className="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent flex items-center p-16">
                                    <div className="max-w-md">
                                        <h3 className="text-4xl font-black text-white mb-6 leading-tight">Built to scale <br /> India's MSMEs.</h3>
                                        <p className="text-neutral-300 font-medium mb-10 leading-relaxed">Seamlessly manage your secured credit line and repayments within the business app.</p>
                                        <button className="bg-purple-600 text-white px-10 py-4 rounded-2xl font-black hover:bg-purple-500 transition-all flex items-center gap-3">
                                            Talk to an Advisor <LucideIcon name="arrow-right" size={20} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Refer & Earn Section */}
                    <section className="max-w-7xl mx-auto px-6 mb-32">
                        <div className="bg-[#8B5CF6] rounded-[4rem] p-16 text-white flex flex-col md:flex-row items-center justify-between gap-12 relative overflow-hidden group shadow-2xl shadow-purple-200">
                            <div className="absolute -right-20 -top-20 w-96 h-96 bg-white/20 blur-[100px] rounded-full group-hover:scale-110 transition-transform duration-700"></div>
                            <div className="z-10 text-center md:text-left">
                                <h4 className="text-5xl font-black italic tracking-tighter mb-4">refer & earn</h4>
                                <p className="text-purple-100 text-xl font-medium">Invite a fellow founder and earn flat ₹300 per successful signup.</p>
                            </div>
                            <button className="bg-white text-black px-12 py-5 rounded-[1.8rem] font-black text-lg hover:scale-105 transition-all shadow-2xl active:scale-95 z-10 whitespace-nowrap">
                                Invite Friends
                            </button>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-white border-t border-neutral-100 pt-40 pb-16">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-16 mb-32">
                                <div className="col-span-2 space-y-8">
                                    <div className="flex items-center gap-2">
                                        <div className="w-8 h-8 bg-black rounded-lg flex items-center justify-center">
                                            <div className="w-4 h-4 border-2 border-white rotate-45"></div>
                                        </div>
                                        <span className="text-2xl font-black tracking-tighter italic">slice business</span>
                                    </div>
                                    <p className="text-neutral-400 font-medium max-w-xs leading-relaxed">
                                        Empowering the builders of tomorrow with financial tools that are fast, transparent, and digital-first.
                                    </p>
                                    <div className="flex gap-4">
                                        {[1,2,3].map(i => (
                                            <div key={i} className="w-12 h-12 bg-neutral-50 rounded-2xl flex items-center justify-center text-neutral-400 hover:text-black hover:bg-neutral-100 transition-all cursor-pointer">
                                                <div className="w-5 h-5 bg-current rounded-md"></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <div className="font-black text-xs uppercase tracking-[0.2em]">Products</div>
                                    <ul className="text-neutral-400 text-sm space-y-4 font-bold">
                                        <li><button onClick={() => scrollToSection('accounts')} className="hover:text-purple-600 transition-colors">Current Account</button></li>
                                        <li><button onClick={() => scrollToSection('digital-loans')} className="hover:text-purple-600 transition-colors">Business Loan</button></li>
                                        <li><button onClick={() => scrollToSection('enterprise')} className="hover:text-purple-600 transition-colors">Enterprise Loan</button></li>
                                    </ul>
                                </div>
                                <div className="space-y-6">
                                    <div className="font-black text-xs uppercase tracking-[0.2em]">Company</div>
                                    <ul className="text-neutral-400 text-sm space-y-4 font-bold">
                                        <li><a href="#" className="hover:text-purple-600 transition-colors">Safety</a></li>
                                        <li><a href="#" className="hover:text-purple-600 transition-colors">Help Center</a></li>
                                        <li><a href="#" className="hover:text-purple-600 transition-colors">Media</a></li>
                                    </ul>
                                </div>
                                <div className="space-y-6">
                                    <div className="font-black text-xs uppercase tracking-[0.2em]">Legal</div>
                                    <ul className="text-neutral-400 text-sm space-y-4 font-bold">
                                        <li><a href="#" className="hover:text-purple-600 transition-colors">Privacy Policy</a></li>
                                        <li><a href="#" className="hover:text-purple-600 transition-colors">Terms of Service</a></li>
                                        <li><a href="#" className="hover:text-purple-600 transition-colors">RBI Disclosure</a></li>
                                    </ul>
                                </div>
                            </div>
                            <div className="pt-12 border-t border-neutral-100 flex flex-col md:flex-row justify-between items-center gap-8 text-center md:text-left">
                                <div className="text-[10px] font-black uppercase tracking-[0.2em] text-neutral-300">
                                    © 2024 slice. GaragePreneur Internet Pvt Ltd. Registered NBFC Partner.
                                </div>
                                <div className="flex gap-8 text-[10px] font-black uppercase tracking-[0.2em] text-neutral-300">
